name: Increment public update counter
on:
  push:
    branches: [main]
    paths-ignore:
      - 'commit-counter.txt'
permissions:
  contents: write
jobs:
  bump:
    if: github.event.head_commit.message != 'chore: install automatic update counter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Increment counter
        shell: bash
        run: |
          current=$(cat commit-counter.txt 2>/dev/null || echo 0)
          if ! [[ "$current" =~ ^[0-9]+$ ]]; then current=0; fi
          echo "$((10#$current + 1))" > commit-counter.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commit-counter.txt
          git commit -m "chore: bump public update counter [skip ci]"
          git push
